<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medidor de Frecuencia Cardíaca (BPM)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    video {
      display: none;
    }
    .display {
      font-size: 3em;
      font-weight: bold;
      color: #e74c3c;
      margin: 20px 0;
    }
    button {
      padding: 12px 24px;
      font-size: 1em;
      color: #fff;
      background-color: #3498db;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
    }
    button:disabled {
      background-color: #bdc3c7;
    }
    .tap-btn {
      background-color: #2ecc71;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Medidor de BPM</h2>
    <video id="webcam" autoplay playsinline></video>
    
    <div class="display" id="bpmTexto">-- BPM</div>

    <button id="btnCamara" onclick="iniciarCamara()">Iniciar Cámara + Linterna</button>
    <button id="btnDetener" onclick="detenerCamara()" disabled>Detener</button>
    <hr>
    <p>O usa el modo manual pulsando al ritmo de tu pulso:</p>
    <button class="tap-btn" onclick="registrarTap()">Tap Ritmo</button>
  </div>

  <script>
    let videoStream = null;
    let tiemposTap = [];

    async function iniciarCamara() {
      try {
        // 1. Solicitud de acceso a la cámara trasera
        videoStream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: { exact: "environment" },
            width: { ideal: 640 },
            height: { ideal: 480 }
          } 
        }).catch(async () => {
          // Si falla la cámara exacta trasera, solicita cualquier cámara trasera/disponible
          return await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        });

        const video = document.getElementById('webcam');
        video.srcObject = videoStream;

        // 2. Esperar a que el video cargue metadatos antes de pedir capacidades de linterna
        await new Promise((resolve) => {
          video.onloadedmetadata = () => resolve();
        });

        await video.play();

        // 3. Encender la linterna (Torch)
        const track = videoStream.getVideoTracks()[0];
        if (track && typeof track.getCapabilities === 'function') {
          const capabilities = track.getCapabilities();
          if (capabilities.torch) {
            await track.applyConstraints({
              advanced: [{ torch: true }]
            }).catch(err => console.log("No se pudo encender la linterna:", err));
          } else {
            document.getElementById('bpmTexto').innerText = "Sin linterna";
          }
        }

        document.getElementById('btnCamara').disabled = true;
        document.getElementById('btnDetener').disabled = false;
        if(document.getElementById('bpmTexto').innerText.includes("Sin linterna") === false) {
          document.getElementById('bpmTexto').innerText = "Midiendo...";
        }

      } catch (e) {
        console.error(e);
        document.getElementById('bpmTexto').innerText = "Error / Usa Tap";
        alert("No se pudo acceder a la cámara o linterna. Asegúrate de usar HTTPS o localhost.");
      }
    }

    function detenerCamara() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('btnCamara').disabled = false;
      document.getElementById('btnDetener').disabled = true;
      document.getElementById('bpmTexto').innerText = "-- BPM";
    }

    // Modo Manual por Taps
    function registrarTap() {
      const ahora = Date.now();
      tiemposTap.push(ahora);

      // Conservar solo los últimos 4 segundos de pulsaciones
      tiemposTap = tiemposTap.filter(t => ahora - t < 4000);

      if (tiemposTap.length > 1) {
        const intervalos = [];
        for (let i = 1; i < tiemposTap.length; i++) {
          intervalos.push(tiemposTap[i] - tiemposTap[i - 1]);
        }
        const promedioIntervalo = intervalos.reduce((a, b) => a + b) / intervalos.length;
        const bpmCalculado = Math.round(60000 / promedioIntervalo);
        document.getElementById('bpmTexto').innerText = `${bpmCalculado} BPM`;
      }
    }
  </script>
</body>
</html>
